databases:
  - name: modern-healthcare-db
    databaseName: modern_healthcare
    user: healthcare
    plan: free

services:
  - type: web
    name: modern-healthcare-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: modern-healthcare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
